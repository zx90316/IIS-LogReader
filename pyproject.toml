[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iis-log-reader"
version = "1.2.1"
description = "Desktop IIS W3C log analyzer with SQLite cache, filtering, stats, and report export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "IIS-LogReader Contributors" },
]
keywords = [
  "iis",
  "w3c",
  "log",
  "analyzer",
  "sqlite",
  "pyside6",
  "security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
]
dependencies = [
  "PySide6>=6.6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "nuitka>=2.4",
  "ordered-set>=4.1",
  "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/zx90316/IIS-LogReader"
Issues = "https://github.com/zx90316/IIS-LogReader/issues"
Changelog = "https://github.com/zx90316/IIS-LogReader/blob/main/CHANGELOG.md"

[project.scripts]
iis-log-reader = "iis_log_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["iis_log_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
