---
name: Bug report
description: Report a bug in IIS Log Reader
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. **Do not paste production logs** that may contain personal or secret data.
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Prefer using `_smoke_sample/` style synthetic logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, app version 1.0.0"
    validations:
      required: true
